name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: CI never writes to the repo, and fork PRs get no secrets.
permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Toolchain
        run: swift --version

      - name: Build
        run: swift build

      - name: Translations
        run: ./scripts/check-localizations.sh

      - name: Version
        run: ./scripts/check-version.sh

      - name: Test
        run: swift test

      - name: Package the app
        run: ./scripts/build-app.sh
